name: Restraint timer validation
on:
  push:
    branches:
      - feature/restraint-timers
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: |
          for file in js/*.js shared/*.js worker/src/*.js; do node --check "$file"; done
