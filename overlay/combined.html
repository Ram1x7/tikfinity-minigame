<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>らみん民 統合LIVE画面</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#wrap{position:relative;width:100%;height:100%}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
#mini{z-index:2;pointer-events:none}#game{z-index:1}
</style></head><body><div id="wrap">
<iframe id="game" title="ガチャ・ルーレット" allow="autoplay"></iframe>
<iframe id="mini" title="らみん民オーバーレイ"></iframe>
</div><script>
const p=new URLSearchParams(location.search);
const game=new URL('../display.html',location.href);
const mini=new URL('./display.html',location.href);
// 元のdisplay.htmlが使う env や表示キーなどのURLパラメータを、そのまま渡す。
// 秘密情報を外部サイトへ送信せず、同一オリジンのiframeにだけ渡す。
game.search=p.toString();
mini.search=p.toString();
document.getElementById('game').src=game.href;
document.getElementById('mini').src=mini.href;
</script></body></html>
